    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HyperLock</title>

   <style>

:root {
    --bg: #07070d;
    --bg2: #0f0f1a;
    --bg3: #141420;
    --bg4: #1a1a28;
    --bg5: #1f1f30;
    --border: rgba(255, 255, 255, 0.07);
    --border2: rgba(255, 255, 255, 0.14);
    --border3: rgba(255, 255, 255, 0.22);
    --text: #e8e8f0;
    --text2: #6b6b88;
    --text3: #4a4a60;
    --red: #ff3355;
    --green: #00e87a;
    --blue: #3b82f6;
    --cyan: #00d4ff;
    --purple: #8b5cf6;
    --orange: #f97316;
    --pink: #ec4899;
    --gold: #FFD700;
    --star-color: #f59e0b;
    --star-empty: #2a2a40;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
}
body {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
}
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ===== KEYFRAMES ===== */
@keyframes pulseDot {
    0%,100% { box-shadow: 0 0 6px var(--green); }
    50% { box-shadow: 0 0 14px var(--green), 0 0 4px var(--green); }
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes spinR {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.6); }
}
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
@keyframes goldFall {
    0% { transform: translateY(-12px) rotate(0deg); opacity: 1; }
    80% { opacity: 0.6; }
    100% { transform: translateY(220px) rotate(360deg); opacity: 0; }
}
@keyframes sakuraFall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.1; }
}

/* ===== SAKURA BACKGROUND ===== */
#sakura-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.sakura-petal {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #ffb7c5, #ff6b8a);
    border-radius: 50% 0 50% 50%;
    opacity: 0.6;
    animation: sakuraFall linear infinite;
}

/* ===== TOAST ===== */
#toast {
    position: fixed;
    top: 78px;
    left: 50%;
transform: translateX(-50%) translateY(-90px);
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    z-index: 9999;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    gap: 7px;
}
#toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}
#toast.ok { border-color: rgba(0, 232, 122, 0.3); color: var(--green); }
#toast.err { border-color: rgba(255, 51, 85, 0.3); color: var(--red); }

/* ===== SCREENS ===== */
.screen {
    position: absolute;
    inset: 0;
    padding: 0;
    overflow-y: auto;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    background: var(--bg);
}
.screen.active {
    opacity: 1;
    pointer-events: auto;
}
#screen-main {
    max-width: 480px;
    margin: 0 auto;
}
.screen::-webkit-scrollbar { display: none; }

/* ===== LOGIN SCREEN ===== */
.login-wrapper {
    max-width: 480px;
    width: 100%;
    margin: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.glass-card {
    background: rgba(14, 10, 28, 0.45);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 51, 85, 0.08);
    border-radius: 25px;
    padding: 22px 24px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
}
.glass-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -80%;
    width: 60%;
    height: 200%;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 51, 85, 0.02) 45%, rgba(255, 180, 220, 0.05) 50%, transparent 65%);
    transform: skewX(-22deg);
    animation: shimmer 5s ease-in-out infinite;
    pointer-events: none;
}
.glass-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 16px 56px rgba(0, 0, 0, 0.45), 0 0 40px rgba(255, 51, 85, 0.06);
    border-color: rgba(255, 51, 85, 0.18);
}
.founder-card {
    background: rgba(14, 10, 28, 0.6);
    backdrop-filter: blur(18px);
    border-radius: 25px;
    padding: 20px 22px 18px;
    border: 1px solid rgba(255, 51, 85, 0.12);
    text-align: center;
    animation: floatUp 5s ease-in-out infinite;
}
.founder-title {
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: rgba(255, 180, 220, 0.4);
    margin-bottom: 8px;
}
.founder-names {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
}
.founder-item {
    font-family: 'Segoe UI', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 51, 85, 0.10);
    letter-spacing: 0.04em;
}
.founder-item small {
    font-weight: 400;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.75rem;
    display: block;
}
.login-logo {
    font-family: 'Segoe UI', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 30px rgba(255, 51, 85, 0.2);
    letter-spacing: 0.08em;
    text-align: center;
    display: inline-block;
    background: linear-gradient(90deg, #ffffff, #ff9aaa, #ff3355, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: floatUp 4s ease-in-out infinite, shimmer 3s ease-in-out infinite;
}
.login-sub {
    text-align: center;
    color: rgba(255, 255, 255, 0.35);
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
}
.terms-label, .hint-label, .input-label {
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.2);
    margin-bottom: 10px;
}
.key-toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 51, 85, 0.04);
}
.key-toggle-row:last-child { border-bottom: none; }
.key-toggle-label {
    font-size: 0.85rem;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
}
.key-terms {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
}
.key-terms span {
    color: rgba(255, 180, 220, 0.6);
    cursor: default;
}
.key-hint {
    background: rgba(255, 51, 85, 0.04);
    border-radius: 16px;
    padding: 14px 18px;
    border: 1px solid rgba(255, 51, 85, 0.04);
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.7;
}
.key-hint strong { color: rgba(255, 255, 255, 0.7); font-weight: 500; }
.input-box {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 51, 85, 0.08);
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: all 0.35s ease;
}
.input-box:focus {
    border-color: rgba(255, 51, 85, 0.3);
    box-shadow: 0 0 30px rgba(255, 51, 85, 0.04);
    background: rgba(0, 0, 0, 0.45);
}
.input-box:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-premium {
    width: 100%;
    padding: 16px 24px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, rgba(255, 51, 85, 0.20), rgba(139, 92, 246, 0.15));
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 0.04em;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 51, 85, 0.08);
    position: relative;
    overflow: hidden;
}
.btn-premium:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 51, 85, 0.08);
    border-color: rgba(255, 51, 85, 0.18);
}
.btn-premium:active { transform: scale(0.97); }
.btn-premium:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
.btn-premium.primary {
    background: linear-gradient(135deg, rgba(255, 51, 85, 0.30), rgba(139, 92, 246, 0.25));
    border-color: rgba(255, 51, 85, 0.20);
    box-shadow: 0 4px 24px rgba(255, 51, 85, 0.15);
}
.btn-premium.primary:hover {
    box-shadow: 0 8px 40px rgba(255, 51, 85, 0.25), 0 0 60px rgba(255, 51, 85, 0.06);
}
.toggle-ios {
    position: relative;
    width: 52px;
    height: 28px;
    flex-shrink: 0;
    touch-action: manipulation;
}
.toggle-ios input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-ios .track {
    position: absolute; inset: 0;
